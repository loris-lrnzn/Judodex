<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Le cachet du carnet : un hanko vermillon sur le tapis, l'idéogramme de
       la souplesse gravé en réserve. Il tient dans la zone sûre d'une icône
       masquable. -->
  <rect width="512" height="512" fill="#0f2e20"/>
  <rect x="96" y="96" width="320" height="320" fill="#ff6c53"/>
  <rect x="116" y="116" width="280" height="280" fill="none" stroke="#0f2e20" stroke-opacity=".35" stroke-width="6"/>
  <text x="256" y="336" font-family="Shippori Mincho B1, Noto Serif JP, serif" font-size="210" font-weight="800"
        text-anchor="middle" fill="#0f2e20">柔</text>
</svg>
